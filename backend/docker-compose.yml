services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ams_auth
      POSTGRES_USER: ams_auth
      POSTGRES_PASSWORD: ams_auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_auth -d ams_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  business-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ams_business
      POSTGRES_USER: ams_business
      POSTGRES_PASSWORD: ams_business
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_business -d ams_business"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - business-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_NAME: ams_auth
      DB_USER: ams_auth
      DB_PASSWORD: ams_auth
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "8080:8080"

  business-service:
    build: ./business-service
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://ams_business:ams_business@business-db:5432/ams_business
      AUTH_SERVICE_BASE_URL: http://auth-service:8080
      JWT_JWKS_URL: http://auth-service:8080/.well-known/jwks.json
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-8}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-KaizenX Procurement}
    depends_on:
      auth-service:
        condition: service_started
      business-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  auth-db-data:
  business-db-data:
